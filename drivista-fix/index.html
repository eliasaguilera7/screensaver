  <title>DRIVISTA — Reserve Your Ride</title>

<body>
  <div class="rhye-cursor" id="rhyeCursor" aria-hidden="true">
    <svg class="rhye-cursor-svg" width="60" height="60" viewBox="0 0 50 50" aria-hidden="true">
      <circle class="rhye-cursor-inner" cx="25" cy="25" r="24"></circle>
      <circle class="rhye-cursor-outer" cx="25" cy="25" r="24"></circle>
    </svg>
  </div>
  <button id="startExperience" class="experience-start" type="button" hidden>
    Tap to keep the screen awake
  </button>
  <main class="stage" aria-label="DRIVISTA ride reservation">
    <div class="background-slider" aria-hidden="true">
      <canvas class="distortion-canvas" id="distortionCanvas"></canvas>
      <div class="image-overlay"></div>
    </div>
    <header class="brandbar">
      <div class="top-actions">
        <div class="contact-menu-wrap">
              </span>
            </a>

        <div class="weather-card" aria-label="Current local weather, date and time">
          <div class="weather-location">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg>
            <span id="clockLocation">The Crossings</span>
          </div>
          <div class="weather-main">
            <div class="weather-temperature-row">
              <strong id="weatherTemp" class="weather-temp">--<span>°</span></strong>
            </div>
            <div class="weather-condition-row">
              <span id="weatherEmoji" class="weather-emoji" aria-hidden="true">☁️</span>
              <span id="weatherCondition">Weather</span>
            </div>
            <div id="weatherHighLow" class="weather-high-low">H:--°F · L:--°F</div>
          </div>
          <time id="clockTime" class="weather-time">
            <span id="clockTimeMain">--:--</span><span id="clockPeriod" class="clock-period"></span>
          </time>
          <div id="clockDate" class="weather-date">Loading date…</div>
        </div>
      </div>
    </header>
